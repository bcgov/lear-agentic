# Explicit CodeQL advanced-setup workflow (TEST-001).
# Default CodeQL setup is enabled on this repo and already analyzes PRs
# (python / javascript-typescript / actions). Running advanced upload on
# pull_request fails SARIF processing ("default setup is enabled").
# Keep this workflow for main push / schedule / manual so SAST stays
# portable in-repo; PRs rely on default setup until an admin consolidates.
name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
